<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Galería de obras de arte de Lorena Minoretti, inspiradas en la naturaleza y el océano.">
    <meta name="keywords" content="arte, pintura, Lorena Minoretti, obras originales, arte contemporáneo">
    <title>Obras - Lorena Minoretti Art</title>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;600;700&family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400&family=Playfair+Display:wght@600&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/swiper/swiper-bundle.min.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body class="flex flex-col min-h-screen">
    <!-- Header -->
    <header class="header sticky top-0 z-50 shadow-md" style="background-color: #E6F0FA;">
        <div class="container mx-auto flex justify-between items-center p-4">
            <a href="index.html" class="logo font-serif text-2xl font-semibold" style="color: #1E3A5F;">Lorena Minoretti Art</a>
            <nav class="navbar hidden md:flex" id="navbar">
                <ul class="flex gap-6">
                    <li><a href="obras.html" class="font-semibold hover:opacity-75" style="color: #1E3A5F;">Obras</a></li>
                    <li><a href="quien_soy.html" class="font-semibold hover:opacity-75" style="color: #1E3A5F;">Quién Soy</a></li>
                    <li><a href="contacto.html" class="font-semibold hover:opacity-75" style="color: #1E3A5F;">Contacto</a></li>
                </ul>
            </nav>
            <button class="menu-toggle md:hidden text-2xl" style="color: #1E3A5F;" id="menu-toggle" aria-label="Abrir menú">☰</button>
        </div>
    </header>

    <!-- Obras Section -->
    <section id="contenedor-obras" class="obras-grid py-12" style="background-color: #FFF8E7;">
        <div class="container mx-auto">
            <h2 class="font-serif text-3xl md:text-4xl mb-6 text-center" style="color: #1E3A5F;">Galería de Obras</h2>
            <div class="filters flex justify-center gap-4 mb-8 flex-wrap">
                <button class="filter-btn px-4 py-2 rounded-lg transition-colors" style="background-color: #84B6F4; color: #1E3A5F;" data-filter="all" onmouseover="this.style.backgroundColor='#4D82BC'" onmouseout="this.style.backgroundColor='#84B6F4'">Todas</button>
                <button class="filter-btn px-4 py-2 rounded-lg transition-colors" style="background-color: #84B6F4; color: #1E3A5F;" data-filter="Acrílico" onmouseover="this.style.backgroundColor='#4D82BC'" onmouseout="this.style.backgroundColor='#84B6F4'">Acrílicos</button>
                <button class="filter-btn px-4 py-2 rounded-lg transition-colors" style="background-color: #84B6F4; color: #1E3A5F;" data-filter="Acuarelas" onmouseover="this.style.backgroundColor='#4D82BC'" onmouseout="this.style.backgroundColor='#84B6F4'">Acuarelas</button>
                <button class="filter-btn px-4 py-2 rounded-lg transition-colors" style="background-color: #84B6F4; color: #1E3A5F;" data-filter="Baúles y arcones" onmouseover="this.style.backgroundColor='#4D82BC'" onmouseout="this.style.backgroundColor='#84B6F4'">Baúles y arcones</button>
                <button class="filter-btn px-4 py-2 rounded-lg transition-colors" style="background-color: #84B6F4; color: #1E3A5F;" data-filter="Juego de Mesa" onmouseover="this.style.backgroundColor='#4D82BC'" onmouseout="this.style.backgroundColor='#84B6F4'">Juegos</button>
                <button class="filter-btn px-4 py-2 rounded-lg transition-colors" style="background-color: #84B6F4; color: #1E3A5F;" data-filter="Ilustraciones" onmouseover="this.style.backgroundColor='#4D82BC'" onmouseout="this.style.backgroundColor='#84B6F4'">Ilustraciones</button>
                <button class="filter-btn px-4 py-2 rounded-lg transition-colors" style="background-color: #84B6F4; color: #1E3A5F;" data-filter="Libro" onmouseover="this.style.backgroundColor='#4D82BC'" onmouseout="this.style.backgroundColor='#84B6F4'">Libros</button>
                <button class="filter-btn px-4 py-2 rounded-lg transition-colors" style="background-color: #84B6F4; color: #1E3A5F;" data-filter="Óleos" onmouseover="this.style.backgroundColor='#4D82BC'" onmouseout="this.style.backgroundColor='#84B6F4'">Óleos</button>
                <button class="filter-btn px-4 py-2 rounded-lg transition-colors" style="background-color: #84B6F4; color: #1E3A5F;" data-filter="Postales" onmouseover="this.style.backgroundColor='#4D82BC'" onmouseout="this.style.backgroundColor='#84B6F4'">Postales</button>
                <button class="filter-btn px-4 py-2 rounded-lg transition-colors" style="background-color: #84B6F4; color: #1E3A5F;" data-filter="Réplicas Intervenidas" onmouseover="this.style.backgroundColor='#4D82BC'" onmouseout="this.style.backgroundColor='#84B6F4'">Réplicas Intervenidas</button>
            </div>
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6" id="obras-container"></div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="footer text-white text-center py-6" style="background-color: #005187;">
        <div class="container mx-auto">
            <p>© 2025 Lorena Minoretti Art</p>
            <p class="mt-2">
                <a href="https://www.instagram.com/lorena_minoretti_art" target="_blank" rel="noopener noreferrer" class="hover:underline transition-colors" style="color: #A3C7FF;" onmouseover="this.style.color='#E6F0FA'" onmouseout="this.style.color='#A3C7FF'">Instagram</a> |
                <a href="https://wa.me/5491167852021" target="_blank" rel="noopener noreferrer" class="hover:underline transition-colors" style="color: #A3C7FF;" onmouseover="this.style.color='#E6F0FA'" onmouseout="this.style.color='#A3C7FF'">WhatsApp</a>
            </p>
        </div>
    </footer>

    <!-- Modal -->
    <div id="modal" class="modal hidden fixed inset-0 bg-black bg-opacity-75 flex items-center justify-center z-50">
        <div class="modal-content bg-white rounded-lg p-8 max-w-4xl w-full mx-4 relative max-h-[90vh] overflow-y-auto">
            <button class="modal-close fixed top-4 right-4 text-3xl text-white bg-blue-900 rounded-full w-12 h-12 flex items-center justify-center transition-colors z-60" style="background-color: #1E3A5F;" onmouseover="this.style.backgroundColor='#4D82BC'" onmouseout="this.style.backgroundColor='#1E3A5F'" aria-label="Cerrar modal">×</button>
            <div id="modal-body" class="flex flex-col gap-6"></div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://unpkg.com/swiper/swiper-bundle.min.js"></script>
    <script src="obras.js"></script>
</body>
</html>
