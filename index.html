<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Explora las obras de arte únicas de Lorena Minoretti, artista especializada en pintura contemporánea y abstracción.">
  <meta name="keywords" content="arte, pintura, Lorena Minoretti, obras originales, arte contemporáneo">
  <title>Lorena Minoretti</title>

  <!-- Fonts & Swiper (CDN) -->
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;500&family=Playfair+Display:wght@300;400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/swiper/swiper-bundle.min.css">

  <!-- Local styles (desde la carpeta lorena/) -->
  <link rel="stylesheet" href="lorena/styles.css">
</head>
<body>
  <!-- Header -->
  <header class="header">
    <div class="container">
      <h1 class="artist-name">Lorena Minoretti Art</h1>
    </div>
  </header>

  <!-- Navigation -->
  <nav class="main-navigation">
    <div class="container">
      <div class="nav-links">
        <!-- Si las páginas están dentro de /lorena/, enlazá a lorena/quien_soy.html etc. -->
        <a href="#obras">Obras</a>
        <a href="lorena/quien_soy.html">Sobre Mí</a>
        <a href="lorena/contacto.html">Contacto</a>
      </div>
      <button class="menu-toggle" id="menu-toggle" aria-label="Abrir menú">☰</button>
    </div>
  </nav>

  <div class="mobile-menu" id="navbar">
    <a href="#obras">Obras</a>
    <a href="lorena/quien_soy.html">Sobre Mí</a>
    <a href="lorena/contacto.html">Contacto</a>
  </div>

  <main>
    <!-- Hero -->
    <section class="hero-section">
      <div class="container">
        <h2 class="hero-title">Arte & Naturaleza:</h2>
        <h4 class="hero-subtitle">La inspiración sublime que llena mi arte de magia, luz y admiración</h4>

        <div class="swiper hero-swiper">
          <div class="swiper-wrapper">
            <div class="swiper-slide"><img src="lorena/img/carrusel1.png" alt="" loading="lazy"></div>
            <div class="swiper-slide"><img src="lorena/img/carrusel2.png" alt="" loading="lazy"></div>
            <div class="swiper-slide"><img src="lorena/img/carrusel3.png" alt="" loading="lazy"></div>
          </div>
          <div class="swiper-button-prev"></div>
          <div class="swiper-button-next"></div>
          <div class="swiper-pagination"></div>
        </div>
      </div>
    </section>

    <!-- Obras -->
    <section class="works-section" id="obras">
      <div class="container">
        <h2 class="section-title">Obras</h2>

        <div class="filters">
          <button class="filter-btn active" data-filter="Todas">Todas</button>
          <button class="filter-btn" data-filter="Obra pictórica">Obra Pictórica</button>
          <button class="filter-btn" data-filter="Acuarelas e Ilustraciones">Acuarelas e Ilustraciones</button>
          <button class="filter-btn" data-filter="Libros & Postales">Libros & Postales</button>
          <button class="filter-btn" data-filter="Baúles & Deco">Baúles & Deco</button>
          <button class="filter-btn" data-filter="TerrAqEcoJuego">TerrAqEcoJuego</button>
          <button class="filter-btn" data-filter="Prints">Prints</button>
        </div>

        <div class="gallery" id="obras-container"></div>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="container">
      <p>© 2025 Lorena Minoretti</p>
      <div class="footer-links">
        <a href="https://www.instagram.com/lorena_minoretti_art" target="_blank" rel="noopener noreferrer">Instagram</a>
        <a href="https://wa.me/5491167852021" target="_blank" rel="noopener noreferrer">WhatsApp</a>
      </div>
    </div>
  </footer>

  <!-- Modal -->
  <div id="modal" class="modal">
    <div class="modal-content">
      <button class="modal-close" aria-label="Cerrar modal">×</button>
      <div id="modal-body"></div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="https://unpkg.com/swiper/swiper-bundle.min.js"></script>

  <!-- Tu JS local (está en la carpeta lorena/) -->
  <script src="lorena/index.js"></script>
</body>
</html>
